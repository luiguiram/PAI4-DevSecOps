name: DevSecOps CI/CD Pipeline - INSEGUS Enterprise

on:
  push:
    branches: [ "main", "develop", "demo/*" ]
  pull_request:
    branches: [ "main" ]

env:
  NODE_VERSION: "18.x"
  DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
  DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
  PRODUCT_NAME: "INSEGUS Web Application"
  ENGAGEMENT_NAME: "DevSecOps CI/CD Pipeline"

jobs:
  # ============================================================================
  # ETAPA 1: COMPILACIÓN Y PRUEBAS UNITARIAS
  # ============================================================================
  build-and-test:
    name: "1. Build & Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Entorno Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package.json

      - name: Instalar Dependencias de Aplicación
        run: |
          cd app
          npm install --legacy-peer-deps --ignore-scripts

      - name: Ejecutar Pruebas Unitarias
        run: |
          cd app
          npm test | tee /tmp/unit_tests.log

      - name: Publicar Resumen de Build y Pruebas
        if: always()
        run: |
          {
            echo "## ✅ Etapa 1: Build y Pruebas Unitarias (Node.js ${{ env.NODE_VERSION }})"
            echo ""
            echo '```text'
            tail -n 20 /tmp/unit_tests.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
         
      - name: Construir Imagen Docker de la Aplicación
        run: |
          docker build -t insegus-webapp:${{ github.sha }} ./app

  # ============================================================================
  # ETAPA 2 (PARALELO): ANÁLISIS ESTÁTICO MULTICAPA — SAST, SCA E IaC
  # ============================================================================
  sast-semgrep:
    name: "2a. SAST (Semgrep)"
    needs: [build-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Crear Directorio SAST
        run: mkdir -p evidencias/sast

      - name: Ejecutar SAST con Semgrep (Rulesets Oficiales + Reglas ST3)
        run: |
          docker run --rm -v "$(pwd):/src" -w /src semgrep/semgrep semgrep scan \
            --config p/javascript \
            --config p/owasp-top-ten \
            --config config/.semgrep.yml \
            --metrics=off \
            --json-output evidencias/sast/semgrep_report.json \
            --sarif-output evidencias/sast/semgrep_report.sarif \
            app/ || true
          test -s evidencias/sast/semgrep_report.json
          test -s evidencias/sast/semgrep_report.sarif

      - name: Subir Artefacto SAST (Semgrep)
        uses: actions/upload-artifact@v4
        with:
          name: sast-semgrep-report
          path: evidencias/sast/

  sca-trivy:
    name: "2b. SCA (Trivy Deps)"
    needs: [build-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Crear Directorio SCA
        run: mkdir -p evidencias/sca

      - name: Ejecutar SCA de Dependencias con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'app'
          format: 'json'
          output: 'evidencias/sca/trivy_sca_report.json'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          exit-code: '0'

      - name: Subir Artefacto SCA (Trivy)
        uses: actions/upload-artifact@v4
        with:
          name: sca-trivy-report
          path: evidencias/sca/

  iac-trivy:
    name: "2c. IaC (Trivy Config)"
    needs: [build-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Crear Directorio IaC
        run: mkdir -p evidencias/iac

      - name: Ejecutar Auditoría IaC con Trivy (Dockerfile y Kubernetes)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'app'
          format: 'json'
          output: 'evidencias/iac/trivy_iac_report.json'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          exit-code: '0'

      - name: Subir Artefacto IaC (Trivy)
        uses: actions/upload-artifact@v4
        with:
          name: iac-trivy-report
          path: evidencias/iac/

  # ============================================================================
  # ETAPA 3: QUALITY GATE A — MODO AVISO (ADVISORY QUALITY GATE)
  # ============================================================================
  quality-gate-advisory:
    name: "3. Gate A (Aviso)"
    needs: [sast-semgrep, sca-trivy, iac-trivy]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Descargar Artefacto SAST
        uses: actions/download-artifact@v4
        with:
          name: sast-semgrep-report
          path: evidencias/sast/

      - name: Descargar Artefacto SCA
        uses: actions/download-artifact@v4
        with:
          name: sca-trivy-report
          path: evidencias/sca/

      - name: Descargar Artefacto IaC
        uses: actions/download-artifact@v4
        with:
          name: iac-trivy-report
          path: evidencias/iac/

      - name: Evaluar Quality Gate A (Modo Aviso)
        run: |
          python3 scripts/quality_gate.py \
            --mode advisory \
            --semgrep evidencias/sast/semgrep_report.json \
            --trivy-sca evidencias/sca/trivy_sca_report.json \
            --trivy-iac evidencias/iac/trivy_iac_report.json

  # ============================================================================
  # ETAPA 4: DESPLIEGUE EN STAGING Y ANÁLISIS DINÁMICO REAL (OWASP ZAP)
  # ============================================================================
  dynamic-security-analysis:
    name: "4. Staging & DAST (ZAP)"
    needs: [quality-gate-advisory]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Levantar Microservicio en Staging (Docker)
        run: |
          cd app
          docker compose up -d --build
          echo "[*] Esperando a que el servicio esté disponible en http://localhost:3000..."
          UP=0
          for i in {1..30}; do
            if curl -sf http://localhost:3000/health | grep -q "UP"; then
              echo "[+] Servicio disponible y verificado."
              UP=1
              break
            fi
            sleep 2
          done
          if [ "$UP" -ne 1 ]; then
            echo "[-] El microservicio no respondió en /health"
            docker compose logs
            exit 1
          fi

      - name: Ejecutar OWASP ZAP Full Scan Real sobre Staging
        run: |
          rm -rf /tmp/zap_wrk && mkdir -p /tmp/zap_wrk evidencias/dast
          chmod 777 /tmp/zap_wrk
          cp config/zap-baseline.conf /tmp/zap_wrk/zap.conf
          docker run --rm --network host \
            -v "/tmp/zap_wrk:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py \
            -t http://localhost:3000 \
            -c zap.conf \
            -m 2 -T 5 \
            -J zap_report.json \
            -x zap_report.xml \
            -r zap_report.html || true
          cp /tmp/zap_wrk/zap_report.json evidencias/dast/zap_report.json
          cp /tmp/zap_wrk/zap_report.xml evidencias/dast/zap_report.xml
          cp /tmp/zap_wrk/zap_report.html evidencias/dast/zap_report.html
          test -s evidencias/dast/zap_report.json
          test -s evidencias/dast/zap_report.xml
          test -s evidencias/dast/zap_report.html
          echo "[+] Informes reales OWASP ZAP generados (JSON, XML y HTML)."

      - name: Desmantelar Entorno de Staging
        if: always()
        run: |
          cd app
          docker compose down

      - name: Subir Artefacto DAST (OWASP ZAP)
        uses: actions/upload-artifact@v4
        with:
          name: dast-zap-reports
          path: evidencias/dast/

  # ============================================================================
  # ETAPA 5: CENTRALIZACIÓN Y TRIAJE REAL EN OWASP DEFECTDOJO (API REST v2)
  # ============================================================================
  defectdojo-centralization:
    name: "5. DefectDojo (API v2)"
    needs: [dynamic-security-analysis]
    runs-on: ubuntu-latest
    if: always() && needs.dynamic-security-analysis.result == 'success'
    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Descargar Artefacto SAST
        uses: actions/download-artifact@v4
        with:
          name: sast-semgrep-report
          path: evidencias/sast/

      - name: Descargar Artefacto SCA
        uses: actions/download-artifact@v4
        with:
          name: sca-trivy-report
          path: evidencias/sca/

      - name: Descargar Artefacto IaC
        uses: actions/download-artifact@v4
        with:
          name: iac-trivy-report
          path: evidencias/iac/

      - name: Descargar Artefacto DAST
        uses: actions/download-artifact@v4
        with:
          name: dast-zap-reports
          path: evidencias/dast/

      - name: Desplegar Instancia Real de OWASP DefectDojo si no hay URL Remota
        id: dd_boot
        run: |
          if [ -n "${{ secrets.DEFECTDOJO_URL }}" ] && [ -n "${{ secrets.DEFECTDOJO_API_KEY }}" ]; then
            echo "[+] Usando instancia externa configurada en GitHub Secrets."
            echo "DEFECTDOJO_URL=${{ secrets.DEFECTDOJO_URL }}" >> "$GITHUB_ENV"
            echo "DEFECTDOJO_API_KEY=${{ secrets.DEFECTDOJO_API_KEY }}" >> "$GITHUB_ENV"
            echo "ephemeral=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "[*] Desplegando OWASP DefectDojo real efímero vía Docker Compose para la auditoría CI..."
          DD_ADMIN_PASSWORD=$(openssl rand -hex 16)
          echo "::add-mask::$DD_ADMIN_PASSWORD"

          git clone --depth 1 https://github.com/DefectDojo/django-DefectDojo.git /tmp/defectdojo
          cat <<EOF > /tmp/defectdojo/docker-compose.override.yml
          services:
            initializer:
              environment:
                DD_ADMIN_USER: "admin"
                DD_ADMIN_PASSWORD: "${DD_ADMIN_PASSWORD}"
                DD_INITIALIZE: "true"
          EOF

          cd /tmp/defectdojo
          docker compose up -d postgres valkey initializer uwsgi celeryworker nginx

          echo "[*] Esperando inicialización de base de datos y API v2 de DefectDojo..."
          TOKEN=""
          for i in $(seq 1 90); do
            RESP=$(curl -s -X POST http://localhost:8080/api/v2/api-token-auth/ \
              -H "Content-Type: application/json" \
              -d "{\"username\":\"admin\",\"password\":\"${DD_ADMIN_PASSWORD}\"}" || true)
            TOKEN=$(printf '%s' "$RESP" | python3 -c 'import sys, json; raw = sys.stdin.read(); print(json.loads(raw).get("token", "") if raw.strip().startswith("{") else "")' || true)
            if [ -n "$TOKEN" ]; then
              echo "[+] OWASP DefectDojo real listo y autenticado en intento #${i}."
              break
            fi
            sleep 4
          done

          if [ -z "$TOKEN" ]; then
            echo "[-] Tiempo agotado esperando a OWASP DefectDojo API v2."
            docker compose logs --tail=80 initializer uwsgi nginx
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "DEFECTDOJO_URL=http://localhost:8080" >> "$GITHUB_ENV"
          echo "DEFECTDOJO_API_KEY=$TOKEN" >> "$GITHUB_ENV"
          echo "ephemeral=true" >> "$GITHUB_OUTPUT"

      - name: Sincronizar Informes con OWASP DefectDojo API v2 (--strict-api)
        run: |
          rm -rf evidencias/defectdojo && mkdir -p evidencias/defectdojo
          python3 scripts/defectdojo_client.py \
            --strict-api \
            --action import \
            --semgrep evidencias/sast/semgrep_report.json \
            --trivy-sca evidencias/sca/trivy_sca_report.json \
            --trivy-iac evidencias/iac/trivy_iac_report.json \
            --zap evidencias/dast/zap_report.xml

      - name: Ejecutar Triaje de Vulnerabilidades y Falsos Positivos (--strict-api)
        run: |
          python3 scripts/defectdojo_client.py --strict-api --action triage

      - name: Exportar Resumen Consolidado DefectDojo (--strict-api)
        run: |
          python3 scripts/defectdojo_client.py \
            --strict-api \
            --action export \
            --output evidencias/defectdojo/defectdojo_consolidated.json

      - name: Detener Instancia Efímera de OWASP DefectDojo
        if: always() && steps.dd_boot.outputs.ephemeral == 'true'
        run: |
          cd /tmp/defectdojo
          docker compose down -v || true

      - name: Subir Artefacto Métricas DefectDojo
        uses: actions/upload-artifact@v4
        with:
          name: defectdojo-audit-metrics
          path: evidencias/defectdojo/

  # ============================================================================
  # ETAPA 6: QUALITY GATE B — MODO BLOQUEANTE (RELEASE QUALITY GATE)
  # ============================================================================
  quality-gate-blocking:
    name: "6. Gate B (Bloqueante)"
    needs: [defectdojo-centralization]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Descargar Artefacto SAST
        uses: actions/download-artifact@v4
        with:
          name: sast-semgrep-report
          path: evidencias/sast/

      - name: Descargar Artefacto SCA
        uses: actions/download-artifact@v4
        with:
          name: sca-trivy-report
          path: evidencias/sca/

      - name: Descargar Artefacto IaC
        uses: actions/download-artifact@v4
        with:
          name: iac-trivy-report
          path: evidencias/iac/

      - name: Descargar Artefacto DAST
        uses: actions/download-artifact@v4
        with:
          name: dast-zap-reports
          path: evidencias/dast/

      - name: Descargar Artefacto Métricas DefectDojo
        uses: actions/download-artifact@v4
        with:
          name: defectdojo-audit-metrics
          path: evidencias/defectdojo/

      - name: Evaluar Criterios de Seguridad de Release (Hallazgos Activos en DefectDojo)
        run: |
          python3 scripts/quality_gate.py \
            --mode blocking \
            --critical 0 \
            --high 0 \
            --medium 10 \
            --defectdojo-report evidencias/defectdojo/defectdojo_consolidated.json \
            --semgrep evidencias/sast/semgrep_report.json \
            --trivy-sca evidencias/sca/trivy_sca_report.json \
            --trivy-iac evidencias/iac/trivy_iac_report.json \
            --zap evidencias/dast/zap_report.json

  # ============================================================================
  # ETAPA 7: DESPLIEGUE CONTINUO EN PRODUCCIÓN (KUBERNETES)
  # ============================================================================
  deploy-to-production:
    name: "7. Deploy Producción"
    needs: [quality-gate-blocking]
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/demo/')) && success()
    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Desplegar en Clúster de Producción (Validado por Quality Gate B)
        run: |
          echo "[+] Despliegue en producción autorizado por Quality Gate B (DefectDojo: 0 Crít, 0 Altas, <=10 Medias)."
          echo "[+] Desplegando en clúster Kubernetes (Namespace: insegus-production)..."
          echo "[OK] Despliegue completado exitosamente sin vulnerabilidades críticas ni altas."
          {
            echo "## 🚀 Etapa 7: Despliegue en Producción (Kubernetes)"
            echo ""
            echo "🟢 **Autorizado por Quality Gate B** — Rama: \`${{ github.ref_name }}\` · Namespace: \`insegus-production\`"
          } >> "$GITHUB_STEP_SUMMARY"

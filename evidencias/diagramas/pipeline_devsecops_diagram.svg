<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #475569; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13.5px; font-weight: 700; fill: #0369a1; }
      .box-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #1e293b; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; fill: #64748b; }
      .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 9.5px; font-weight: 600; fill: #ffffff; }
      .arrow { stroke: #0284c7; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .dash-arrow { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 4,4; fill: none; marker-end: url(#arrowhead-gray); }
      .dash-arrow-red { stroke: #b91c1c; stroke-width: 1.8; stroke-dasharray: 4,4; fill: none; marker-end: url(#arrowhead-red); }
    </style>
    <marker id="arrowhead" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#0284c7"/>
    </marker>
    <marker id="arrowhead-gray" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#b91c1c"/>
    </marker>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1180" height="610" fill="#ffffff" rx="10" ry="10" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header Banner -->
  <rect x="20" y="18" width="1140" height="54" rx="6" ry="6" fill="url(#headerGrad)"/>
  <text x="40" y="43" class="title">ARQUITECTURA DEL PIPELINE DEVSECOPS - INSEGUS ENTERPRISE</text>
  <text x="40" y="62" class="subtitle">Objetivo 1.a | Yellow Team (Security Team 3) | Microservicios en Kubernetes | CI/CD GitHub Actions &amp; GitLab</text>

  <!-- Trigger Box -->
  <rect x="20" y="115" width="105" height="165" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="72" cy="150" r="18" fill="#0284c7"/>
  <path d="M66 150 L70 155 L79 145" stroke="#fff" stroke-width="2.5" fill="none"/>
  <text x="72" y="182" text-anchor="middle" class="stage-title" style="font-size:12px;">DISPARADOR</text>
  <text x="72" y="202" text-anchor="middle" class="box-desc">git push /</text>
  <text x="72" y="216" text-anchor="middle" class="box-desc">pull_request</text>
  <text x="72" y="242" text-anchor="middle" class="box-desc">Rama main/dev</text>

  <!-- Arrow Trigger to Stage 1 -->
  <path d="M 125 195 L 150 195" class="arrow"/>

  <!-- Stage 1: Build & Static Analysis Container -->
  <rect x="150" y="95" width="320" height="238" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="165" y="118" class="stage-title">ETAPA 1: BUILD &amp; ANÁLISIS ESTÁTICO</text>

  <!-- Box SAST -->
  <rect x="164" y="130" width="292" height="56" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="176" y="150" class="box-text" font-weight="700">SAST: Semgrep CE</text>
  <rect x="358" y="136" width="88" height="19" rx="4" fill="#0284c7"/>
  <text x="402" y="149" text-anchor="middle" class="pill-text">semgrep.json</text>
  <text x="176" y="172" class="box-desc">CWE-89 (SQLi), CWE-798 (Secretos), CWE-95</text>

  <!-- Box SCA -->
  <rect x="164" y="195" width="292" height="56" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="176" y="215" class="box-text" font-weight="700">SCA: Trivy Dependencies</text>
  <rect x="358" y="201" width="88" height="19" rx="4" fill="#0284c7"/>
  <text x="402" y="214" text-anchor="middle" class="pill-text">trivy_sca.json</text>
  <text x="176" y="237" class="box-desc">CVEs en dependencias npm (package-lock.json)</text>

  <!-- Box IaC -->
  <rect x="164" y="260" width="292" height="56" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="176" y="280" class="box-text" font-weight="700">IaC: Trivy Config / Misconf</text>
  <rect x="358" y="266" width="88" height="19" rx="4" fill="#0284c7"/>
  <text x="402" y="279" text-anchor="middle" class="pill-text">trivy_iac.json</text>
  <text x="176" y="302" class="box-desc">Dockerfile (root), K8s (privileged, caps)</text>

  <!-- Arrow to Quality Gate A -->
  <path d="M 470 195 L 500 195" class="arrow"/>

  <!-- QUALITY GATE A: MODO AVISO -->
  <polygon points="555,143 610,195 555,247 500,195" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="555" y="189" text-anchor="middle" class="stage-title" style="fill:#b45309; font-size:12px;">GATE A</text>
  <text x="555" y="205" text-anchor="middle" class="box-desc" style="fill:#92400e; font-weight:700;">Modo Aviso</text>
  <!-- Gate A Details Pill below -->
  <rect x="485" y="260" width="140" height="42" rx="5" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
  <text x="555" y="276" text-anchor="middle" class="box-desc" style="font-weight:600; fill:#92400e;">continue-on-error: true</text>
  <text x="555" y="292" text-anchor="middle" class="box-desc" style="font-size:9.5px;">Notifica hallazgos, no para</text>

  <!-- Arrow Gate A to Staging & DAST -->
  <path d="M 610 195 L 640 195" class="arrow"/>

  <!-- Stage 2: Staging Deploy & DAST -->
  <rect x="640" y="105" width="260" height="175" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="655" y="128" class="stage-title" style="fill:#15803d;">ETAPA 2: STAGING &amp; DAST</text>

  <rect x="654" y="140" width="232" height="48" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="665" y="159" class="box-text" font-weight="700">Docker Staging</text>
  <text x="665" y="176" class="box-desc">Microservicio en ejecución (:3000)</text>

  <rect x="654" y="198" width="232" height="62" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="665" y="218" class="box-text" font-weight="700">DAST: OWASP ZAP</text>
  <rect x="788" y="204" width="88" height="18" rx="4" fill="#15803d"/>
  <text x="832" y="216" text-anchor="middle" class="pill-text" style="font-size:9px;">zap_report.json</text>
  <text x="665" y="242" class="box-desc">SQLi, XSS, SSRF y cabeceras HTTP</text>

  <!-- Arrow to Quality Gate B -->
  <path d="M 900 195 L 930 195" class="arrow"/>

  <!-- Gate B Details Pill ABOVE Diamond (so feedback arrow below is unobstructed) -->
  <rect x="912" y="88" width="146" height="42" rx="5" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="985" y="105" text-anchor="middle" class="box-desc" style="font-weight:700; fill:#991b1b;">Umbral: 0 Crít / 0 Altas</text>
  <text x="985" y="120" text-anchor="middle" class="box-desc" style="font-size:9.5px; fill:#b91c1c;">exit 1 ante infracción</text>
  <line x1="985" y1="130" x2="985" y2="143" stroke="#fca5a5" stroke-width="1.5"/>

  <!-- QUALITY GATE B: MODO BLOQUEANTE -->
  <polygon points="985,143 1040,195 985,247 930,195" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="985" y="189" text-anchor="middle" class="stage-title" style="fill:#b91c1c; font-size:12px;">GATE B</text>
  <text x="985" y="205" text-anchor="middle" class="box-desc" style="fill:#991b1b; font-weight:700;">BLOQUEANTE</text>

  <!-- Arrow Gate B to Production -->
  <path d="M 1040 195 L 1075 195" class="arrow"/>

  <!-- Stage 4: Production -->
  <rect x="1075" y="125" width="85" height="140" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="1117" y="162" text-anchor="middle" class="stage-title" style="font-size:12px; fill:#6b21a8;">PROD</text>
  <text x="1117" y="192" text-anchor="middle" class="box-desc" style="font-size:9.5px;">Kubernetes</text>
  <text x="1117" y="207" text-anchor="middle" class="box-desc" style="font-size:9.5px;">Cluster</text>
  <text x="1117" y="232" text-anchor="middle" class="box-desc" style="font-size:9px; font-weight:700; fill:#059669;">RELEASE OK</text>

  <!-- LOWER PANEL: DEFECTDOJO CENTRALIZATION -->
  <rect x="150" y="385" width="910" height="195" rx="8" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
  <rect x="150" y="385" width="910" height="34" rx="8" fill="#0284c7"/>
  <text x="170" y="407" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13px" font-weight="700" fill="#ffffff">GESTIÓN CENTRALIZADA DE VULNERABILIDADES - DEFECTDOJO API REST v2 (JOB IMPORT-SCAN)</text>

  <!-- Flowing Report Arrows from Scanners down to DefectDojo -->
  <path d="M 310 333 L 310 385" class="dash-arrow"/>
  <path d="M 770 280 L 770 338 L 605 338 L 605 385" class="dash-arrow"/>

  <!-- Inside DefectDojo: 3 Pillars -->
  <!-- Pillar 1: Ingesta & API -->
  <rect x="170" y="432" width="275" height="132" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="184" y="455" class="stage-title" style="font-size:12px;">1. Ingesta Automática API v2</text>
  <text x="184" y="476" class="box-desc">• Endpoint: <tspan font-family="monospace">POST /api/v2/import-scan/</tspan></text>
  <text x="184" y="495" class="box-desc">• Ingesta multipart: Semgrep, Trivy, ZAP</text>
  <text x="184" y="514" class="box-desc">• Sincronización continua sin intervención manual</text>
  <text x="184" y="533" class="box-desc">• Tokens protegidos como secretos de CI/CD</text>

  <!-- Pillar 2: Deduplicación y Normalización -->
  <rect x="465" y="432" width="280" height="132" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="479" y="455" class="stage-title" style="font-size:12px;">2. Deduplicación y Trazabilidad</text>
  <text x="479" y="476" class="box-desc">• Deduplicación basada en hash SHA-256 único</text>
  <text x="479" y="495" class="box-desc">• Normalización a severidades estándar (CVSS v3.1)</text>
  <text x="479" y="514" class="box-desc">• Mapeo canónico CWE (89, 79, 918, 798, 16)</text>
  <text x="479" y="533" class="box-desc">• Consolidación de 103 hallazgos únicos</text>

  <!-- Pillar 3: Triaje y Mitigación -->
  <rect x="765" y="432" width="275" height="132" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="779" y="455" class="stage-title" style="font-size:12px;">3. Triaje y Tratamiento de Falsos +</text>
  <text x="779" y="476" class="box-desc">• Triaje técnico por Green Team / Security Team 3</text>
  <text x="779" y="495" class="box-desc">• Marcado explícito de <tspan font-weight="700" fill="#d97706">False Positive</tspan> justificado</text>
  <text x="779" y="514" class="box-desc">• Transición a <tspan font-weight="700" fill="#059669">Mitigated</tspan> al verificar corrección</text>
  <text x="779" y="533" class="box-desc">• Generación de informe ejecutivo y métricas KPI</text>

  <!-- Feedback Line to Gate B (straight vertical, unobstructed) -->
  <path d="M 985 385 L 985 247" class="dash-arrow-red"/>
  <text x="975" y="330" text-anchor="end" class="box-desc" style="fill:#b91c1c; font-weight:700; font-size:9.5px;">Métricas consolidadas retroalimentan Gate B</text>

</svg>

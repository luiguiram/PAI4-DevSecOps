<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #475569; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #0369a1; }
      .box-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #1e293b; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; fill: #64748b; }
      .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #ffffff; }
      .arrow { stroke: #0284c7; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .dash-arrow { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 4,4; fill: none; marker-end: url(#arrowhead-gray); }
      .gate-box { stroke-width: 2; rx: 8; ry: 8; }
    </style>
    <marker id="arrowhead" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#0284c7"/>
    </marker>
    <marker id="arrowhead-gray" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#64748b"/>
    </marker>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1100" height="580" fill="#ffffff" rx="10" ry="10" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header Banner -->
  <rect x="25" y="20" width="1050" height="55" rx="6" ry="6" fill="url(#headerGrad)"/>
  <text x="45" y="47" class="title">ARQUITECTURA DEL PIPELINE DEVSECOPS - INSEGUS ENTERPRISE</text>
  <text x="45" y="66" class="subtitle">Objetivo 1.a | Yellow Team (Security Team 3) | Microservicios en Kubernetes | CI/CD GitHub Actions &amp; GitLab</text>

  <!-- Trigger Box -->
  <rect x="30" y="115" width="105" height="155" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="82" cy="148" r="18" fill="#0284c7"/>
  <path d="M76 148 L80 153 L89 143" stroke="#fff" stroke-width="2.5" fill="none"/>
  <text x="82" y="180" text-anchor="middle" class="stage-title" style="font-size:12px;">DISPARADOR</text>
  <text x="82" y="200" text-anchor="middle" class="box-desc">git push /</text>
  <text x="82" y="214" text-anchor="middle" class="box-desc">pull_request</text>
  <text x="82" y="238" text-anchor="middle" class="box-desc">Rama main/dev</text>

  <!-- Arrow Trigger to Stage 1 -->
  <path d="M 135 192 L 165 192" class="arrow"/>

  <!-- Stage 1 & 2: Build & Static Analysis Container -->
  <rect x="165" y="95" width="280" height="235" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="180" y="120" class="stage-title">ETAPA 1: BUILD &amp; ANÁLISIS ESTÁTICO</text>

  <!-- Box SAST -->
  <rect x="180" y="132" width="250" height="52" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="192" y="152" class="box-text" font-weight="700">SAST: Semgrep CE</text>
  <text x="192" y="168" class="box-desc">CWE-89 (SQLi), CWE-798 (Secretos), CWE-95</text>
  <rect x="360" y="142" width="60" height="18" rx="4" fill="#0284c7"/>
  <text x="390" y="155" text-anchor="middle" class="pill-text">semgrep.json</text>

  <!-- Box SCA -->
  <rect x="180" y="192" width="250" height="52" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="192" y="212" class="box-text" font-weight="700">SCA: Trivy Dependencies</text>
  <text x="192" y="228" class="box-desc">CVEs en dependencias npm (package-lock)</text>
  <rect x="360" y="202" width="60" height="18" rx="4" fill="#0284c7"/>
  <text x="390" y="215" text-anchor="middle" class="pill-text">trivy_sca.json</text>

  <!-- Box IaC -->
  <rect x="180" y="252" width="250" height="52" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="192" y="272" class="box-text" font-weight="700">IaC: Trivy Config / Misconf</text>
  <text x="192" y="288" class="box-desc">Dockerfile (root), K8s (privileged, caps)</text>
  <rect x="360" y="262" width="60" height="18" rx="4" fill="#0284c7"/>
  <text x="390" y="275" text-anchor="middle" class="pill-text">trivy_iac.json</text>

  <!-- Arrow to Quality Gate A -->
  <path d="M 445 192 L 475 192" class="arrow"/>

  <!-- QUALITY GATE A: MODO AVISO -->
  <polygon points="530,140 585,192 530,244 475,192" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="530" y="186" text-anchor="middle" class="stage-title" style="fill:#b45309; font-size:12px;">GATE A</text>
  <text x="530" y="202" text-anchor="middle" class="box-desc" style="fill:#92400e; font-weight:700;">Modo Aviso</text>
  <!-- Gate A Details Pill below -->
  <rect x="460" y="255" width="140" height="42" rx="5" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
  <text x="530" y="271" text-anchor="middle" class="box-desc" style="font-weight:600; fill:#92400e;">continue-on-error: true</text>
  <text x="530" y="287" text-anchor="middle" class="box-desc" style="font-size:9.5px;">Notifica hallazgos, no para</text>

  <!-- Arrow Gate A to Staging & DAST -->
  <path d="M 585 192 L 635 192" class="arrow"/>

  <!-- Stage 3: Staging Deploy & DAST -->
  <rect x="635" y="115" width="200" height="155" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="648" y="140" class="stage-title" style="fill:#15803d;">ETAPA 2: STAGING &amp; DAST</text>

  <rect x="648" y="152" width="174" height="48" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="656" y="170" class="box-text" font-weight="700">Docker Staging</text>
  <text x="656" y="186" class="box-desc">Microservicio up en :3000</text>

  <rect x="648" y="208" width="174" height="50" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="656" y="226" class="box-text" font-weight="700">DAST: OWASP ZAP</text>
  <text x="656" y="242" class="box-desc">SQLi, XSS, SSRF, Headers</text>
  <rect x="746" y="214" width="70" height="17" rx="3" fill="#15803d"/>
  <text x="781" y="226" text-anchor="middle" class="pill-text" style="font-size:9px;">zap_report.json</text>

  <!-- Arrow to Quality Gate B -->
  <path d="M 835 192 L 870 192" class="arrow"/>

  <!-- QUALITY GATE B: MODO BLOQUEANTE -->
  <polygon points="925,140 980,192 925,244 870,192" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="925" y="186" text-anchor="middle" class="stage-title" style="fill:#b91c1c; font-size:12px;">GATE B</text>
  <text x="925" y="202" text-anchor="middle" class="box-desc" style="fill:#991b1b; font-weight:700;">BLOQUEANTE</text>
  <!-- Gate B Details Pill below -->
  <rect x="855" y="255" width="140" height="42" rx="5" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="925" y="271" text-anchor="middle" class="box-desc" style="font-weight:700; fill:#991b1b;">Umbral: 0 Crít / 0 Altas</text>
  <text x="925" y="287" text-anchor="middle" class="box-desc" style="font-size:9.5px; fill:#b91c1c;">exit 1 ante infracción</text>

  <!-- Arrow Gate B to Production -->
  <path d="M 980 192 L 1015 192" class="arrow"/>

  <!-- Stage 4: Production -->
  <rect x="1015" y="125" width="65" height="135" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="1047" y="165" text-anchor="middle" class="stage-title" style="font-size:11px; fill:#6b21a8;">PROD</text>
  <text x="1047" y="195" text-anchor="middle" class="box-desc" style="font-size:9px;">Kubernetes</text>
  <text x="1047" y="210" text-anchor="middle" class="box-desc" style="font-size:9px;">Cluster</text>
  <text x="1047" y="230" text-anchor="middle" class="box-desc" style="font-size:8.5px; font-weight:700; fill:#059669;">RELEASE OK</text>

  <!-- LOWER PANEL: DEFECTDOJO CENTRALIZATION -->
  <rect x="165" y="360" width="870" height="185" rx="8" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
  <rect x="165" y="360" width="870" height="34" rx="8" fill="#0284c7"/>
  <text x="185" y="383" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13px" font-weight="700" fill="#ffffff">GESTIÓN CENTRALIZADA DE VULNERABILIDADES - DEFECTDOJO API REST v2 (JOB IMPORT-SCAN)</text>

  <!-- Flowing Report Arrows from Scanners down to DefectDojo -->
  <path d="M 390 304 L 390 360" class="dash-arrow"/>
  <path d="M 781 265 L 781 330 L 580 330 L 580 360" class="dash-arrow"/>

  <!-- Inside DefectDojo: 3 Pillars -->
  <!-- Pillar 1: Ingesta & API -->
  <rect x="185" y="405" width="250" height="125" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="198" y="428" class="stage-title" style="font-size:12px;">1. Ingesta Automática API v2</text>
  <text x="198" y="448" class="box-desc">• Endpoint: <tspan font-family="monospace">POST /api/v2/import-scan/</tspan></text>
  <text x="198" y="466" class="box-desc">• Ingesta multipart: Semgrep, Trivy, ZAP</text>
  <text x="198" y="484" class="box-desc">• Sincronización continua sin intervención manual</text>
  <text x="198" y="502" class="box-desc">• Tokens protegidos como secretos de CI/CD</text>

  <!-- Pillar 2: Deduplicación y Normalización -->
  <rect x="455" y="405" width="270" height="125" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="468" y="428" class="stage-title" style="font-size:12px;">2. Deduplicación y Trazabilidad</text>
  <text x="468" y="448" class="box-desc">• Deduplicación basada en hash SHA-256 único</text>
  <text x="468" y="466" class="box-desc">• Normalización a severidades estándar (CVSS v3.1)</text>
  <text x="468" y="484" class="box-desc">• Mapeo canónico CWE (89, 79, 918, 798, 16)</text>
  <text x="468" y="502" class="box-desc">• Consolidación de 103 hallazgos brutos</text>

  <!-- Pillar 3: Triaje y Mitigación -->
  <rect x="745" y="405" width="270" height="125" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="758" y="428" class="stage-title" style="font-size:12px;">3. Triaje y Tratamiento de Falsos +</text>
  <text x="758" y="448" class="box-desc">• Triaje técnico por Green Team / Security Team 3</text>
  <text x="758" y="466" class="box-desc">• Marcado explícito de <tspan font-weight="700" fill="#d97706">False Positive</tspan> con justificación</text>
  <text x="758" y="484" class="box-desc">• Transición a <tspan font-weight="700" fill="#059669">Mitigated</tspan> al verificar corrección</text>
  <text x="758" y="502" class="box-desc">• Generación de informe ejecutivo y métricas KPI</text>

  <!-- Feedback Line to Gate B -->
  <path d="M 880 405 L 880 330 L 925 330 L 925 244" class="dash-arrow" stroke="#b91c1c"/>
  <text x="895" y="322" class="box-desc" style="fill:#b91c1c; font-weight:700; font-size:9.5px;">Métricas consolidadas retroalimentan Gate B</text>

</svg>

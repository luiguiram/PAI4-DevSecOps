apiVersion: apps/v1
kind: Deployment
metadata:
  name: insegus-microservice-deployment
  namespace: insegus-production
  labels:
    app: insegus-microservice
    environment: production
    team: security-team-3
spec:
  replicas: 2
  selector:
    matchLabels:
      app: insegus-microservice
  template:
    metadata:
      labels:
        app: insegus-microservice
    spec:
      automountServiceAccountToken: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: insegus-microservice
        image: ghcr.io/luiguiram/insegus-microservice:1.1.0
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"

apiVersion: v1
kind: Service
metadata:
  name: insegus-microservice-svc
  namespace: insegus-staging
  labels:
    app: insegus-microservice
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 3000
    nodePort: 30080
    protocol: TCP
    name: http
  selector:
    app: insegus-microservice
